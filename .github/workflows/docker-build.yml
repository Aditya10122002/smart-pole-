name: Build and Push VitalsChair Backend

on:
  push:
    branches:
      - main
      - dev
      - main-restored

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Build ARM64 and Push to Docker Hub

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4

      # ── 2. ARM64 emulation ─────────────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # ── 3. Buildx ──────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 4. Docker Hub login ────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Compute tags based on branch ────────────────────────────────────
      - name: Set image tags
        id: tags
        run: |
          SHA=$(echo $GITHUB_SHA | cut -c1-7)
          BRANCH=${GITHUB_REF#refs/heads/}
          IMAGE="aditya10122002/smartpole-backend"

          # Version = major.minor (from VERSION file) + auto-incrementing patch
          # (the GitHub run number). Bump VERSION only for major/minor releases.
          MAJOR_MINOR=$(tr -d '[:space:]' < VERSION)
          VERSION="${MAJOR_MINOR}.${GITHUB_RUN_NUMBER}"

          if [ "$BRANCH" = "main" ]; then
            # production: rolling :latest + immutable :1.0.N (+ sha-pinned)
            echo "tags=${IMAGE}:latest,${IMAGE}:${VERSION},${IMAGE}:${VERSION}-${SHA}" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          else
            # development: rolling :dev + immutable :1.0.N-dev
            echo "tags=${IMAGE}:dev,${IMAGE}:${VERSION}-dev" >> $GITHUB_OUTPUT
            echo "env=development" >> $GITHUB_OUTPUT
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT

      # ── 6. Build summary ───────────────────────────────────────────────────
      - name: Print build info
        run: |
          echo "Branch  : ${{ steps.tags.outputs.branch }}"
          echo "Version : ${{ steps.tags.outputs.version }}"
          echo "SHA     : ${{ steps.tags.outputs.sha }}"
          echo "Env     : ${{ steps.tags.outputs.env }}"
          echo "Tags    : ${{ steps.tags.outputs.tags }}"

      # ── 7. Build and push ──────────────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            IMAGE_ARCH=arm64
            APP_ROOT=/app
          # GitHub Actions cache — speeds up subsequent builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── 8. Post summary to GitHub Actions UI ───────────────────────────────
      - name: Build summary
        run: |
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ steps.tags.outputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.tags.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA | \`${{ steps.tags.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ steps.tags.outputs.env }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags pushed | \`${{ steps.tags.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | linux/arm64 |" >> $GITHUB_STEP_SUMMARY

